name: Windows self-build release

on:
  push:
    tags:
      - 'base-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (base-YYYYMMDD)
        required: true
        default: base-20261018
        type: string
      publish:
        description: Publish the release after both builds succeed (tag must exist at this commit)
        default: false
        type: boolean
      dependencies_only:
        description: Prepare shared dependencies on dev without building the application
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.dependencies_only && github.ref_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      commit: ${{ steps.version.outputs.commit }}
      base: ${{ steps.version.outputs.base }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUBLISH: ${{ !inputs.dependencies_only && (github.event_name == 'push' || inputs.publish) }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^base-([0-9]{8})$ ]]; then
            echo '::error::Release tag must use base-YYYYMMDD.'
            exit 1
          fi
          title="Ayugram Desktop Base ${BASH_REMATCH[1]}"
          commit=$(git rev-parse HEAD)
          if [[ "$PUBLISH" == 'true' ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$commit" ]]; then
              echo '::error::The release tag must point to the selected commit.'
              exit 1
            fi
          fi
          base=$(awk '$1 == "AppVersionStr" { print $2 }' Telegram/build/version)
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    name: Windows ${{ matrix.arch }} packages
    needs: version
    # Larger hosted runner labels require a paid runner allocation in this
    # repository and stay queued indefinitely. This image is schedulable.
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: win64
            libraries: Libraries/win64
            dependency_jobs: 2
            build_parallel: 4
            compiler_parallel: 2
          - arch: x86
            target: win
            libraries: Libraries
            dependency_jobs: 2
            build_parallel: 2
            compiler_parallel: 1
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.commit }}
          path: src
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch == 'x86' && 'amd64_x86' || 'amd64' }}
          sdk: 10.0.26100.0
          toolset: '14.44'
      - name: Check build tools
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:Platform -ne '${{ matrix.arch }}') {
            throw "Unexpected target platform: $env:Platform"
          }
          if (-not (Test-Path (Join-Path $env:VCToolsInstallDir 'atlmfc/include/atlbase.h'))) {
            throw 'The selected MSVC 14.44 toolset requires ATL/MFC.'
          }
          cmake --version
          python --version
          7z i
      - name: Check Inno Setup
        if: ${{ !inputs.dependencies_only }}
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 5/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 5/ISCC.exe')
          )
          if (-not ($candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) })) {
            throw 'Inno Setup compiler (ISCC.exe) is not installed on this runner.'
          }
      - name: Restore third-party tools
        id: tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ThirdParty
          key: windows-2022-tools-py310-v1-${{ hashFiles('src/Telegram/build/prepare/**') }}
          restore-keys: |
            windows-2022-tools-py310-v1-
      - name: Restore libraries
        id: libraries
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ matrix.libraries }}
            !${{ matrix.libraries }}/[qQ]t-*
            !${{ matrix.libraries }}/[qQ]t_*
            !${{ matrix.libraries }}/cache_keys/[qQ]t_*
          key: windows-2022-${{ matrix.arch }}-libs-msvc1444-v1-${{ hashFiles('src/Telegram/build/prepare/**', 'src/Telegram/build/qt_version.py') }}
          restore-keys: |
            windows-2022-${{ matrix.arch }}-libs-msvc1444-v1-
      - name: Restore Qt
        id: qt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ matrix.libraries }}/[qQ]t-*
            ${{ matrix.libraries }}/[qQ]t_*
            ${{ matrix.libraries }}/cache_keys/[qQ]t_*
          key: windows-2022-${{ matrix.arch }}-qt-msvc1444-v1-${{ hashFiles('src/Telegram/build/prepare/**', 'src/Telegram/build/qt_version.py') }}
          restore-keys: |
            windows-2022-${{ matrix.arch }}-qt-msvc1444-v1-
      - name: Report dependency cache status
        run: |
          $rows = @(
            @{ Name = 'ThirdParty tools'; Hit = '${{ steps.tools.outputs.cache-hit }}' },
            @{ Name = '${{ matrix.arch }} libraries'; Hit = '${{ steps.libraries.outputs.cache-hit }}' },
            @{ Name = '${{ matrix.arch }} Qt'; Hit = '${{ steps.qt.outputs.cache-hit }}' }
          )
          $table = @(
            '### Dependency cache status',
            '',
            '| Cache | Exact hit |',
            '| --- | --- |'
          )
          foreach ($row in $rows) {
            $hit = if ($row.Hit -eq 'true') { 'yes' } else { 'no (prepare/resume)' }
            $table += "| $($row.Name) | $hit |"
            Write-Host "$($row.Name): $hit"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($table -join "`n")
      - name: Prepare dependencies
        id: prepare
        if: steps.tools.outputs.cache-hit != 'true' || steps.libraries.outputs.cache-hit != 'true' || steps.qt.outputs.cache-hit != 'true'
        env:
          AYUGRAM_BUILD_JOBS: '${{ matrix.dependency_jobs }}'
          PYTHONUNBUFFERED: '1'
        run: |
          ./src/.github/scripts/prepare_dependencies_with_heartbeat.ps1 `
            -PreparePath "$env:GITHUB_WORKSPACE\src\Telegram\build\prepare\win.bat" `
            -LogPath "$env:RUNNER_TEMP\prepare-${{ matrix.arch }}.log"
      - name: Prune library build intermediates
        run: ./src/.github/scripts/prune_windows_libraries.ps1 -LibrariesPath '${{ matrix.libraries }}'
      - name: Save third-party tools
        if: always() && steps.prepare.outcome == 'success' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ThirdParty
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Save libraries
        if: always() && steps.prepare.outcome == 'success' && steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ matrix.libraries }}
            !${{ matrix.libraries }}/[qQ]t-*
            !${{ matrix.libraries }}/[qQ]t_*
            !${{ matrix.libraries }}/cache_keys/[qQ]t_*
          key: ${{ steps.libraries.outputs.cache-primary-key }}
      - name: Save Qt
        if: always() && steps.prepare.outcome == 'success' && steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ matrix.libraries }}/[qQ]t-*
            ${{ matrix.libraries }}/[qQ]t_*
            ${{ matrix.libraries }}/cache_keys/[qQ]t_*
          key: ${{ steps.qt.outputs.cache-primary-key }}
      - name: Configure Release
        if: ${{ !inputs.dependencies_only }}
        working-directory: src/Telegram
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:API_ID -and -not $env:API_HASH) {
            $env:API_ID = '2040'
            $env:API_HASH = 'b18441a1ff607e10a989891a5462e627'
          }
          if ($env:API_ID -notmatch '^[0-9]+$' -or $env:API_HASH -notmatch '^[a-fA-F0-9]{32}$') {
            throw 'Set both TDESKTOP_API_ID and TDESKTOP_API_HASH, or leave both unset to use docs/api_credentials.md.'
          }
          $arguments = @(
            '${{ matrix.arch }}',
            "-DTDESKTOP_API_ID=$env:API_ID",
            "-DTDESKTOP_API_HASH=$env:API_HASH",
            '-DCMAKE_CONFIGURATION_TYPES=Release',
            '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded',
            '-DCMAKE_C_FLAGS=/utf-8',
            '-DCMAKE_CXX_FLAGS=/utf-8',
            '-DDESKTOP_APP_SPECIAL_TARGET=${{ matrix.target }}',
            '-DDESKTOP_APP_ENABLE_LTO=OFF',
            '-DDESKTOP_APP_DISABLE_AUTOUPDATE=ON',
            '-DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON'
          )
          & ./configure.bat @arguments
          if ($LASTEXITCODE -ne 0) { throw "Configure failed: $LASTEXITCODE" }
      - name: Build Release
        if: ${{ !inputs.dependencies_only }}
        env:
          _CL_: /MP${{ matrix.compiler_parallel }} /FS
        run: |
          ./src/.github/scripts/build_windows_with_heartbeat.ps1 `
            -BuildPath "$env:GITHUB_WORKSPACE\src\out" `
            -Parallel ${{ matrix.build_parallel }} `
            -LogPath "$env:RUNNER_TEMP\build-${{ matrix.arch }}.log"
      - name: Package portable ZIP
        if: ${{ !inputs.dependencies_only }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          ./src/Telegram/build/package_windows.ps1 -Architecture '${{ matrix.arch }}' -ReleaseTag $env:RELEASE_TAG
      - name: Package official installer
        if: ${{ !inputs.dependencies_only }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          ./src/Telegram/build/package_windows_installer.ps1 -Architecture '${{ matrix.arch }}' -ReleaseTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !inputs.dependencies_only }}
        with:
          name: windows-${{ matrix.arch }}-packages
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build diagnostics
        if: ${{ !cancelled() && !inputs.dependencies_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ matrix.arch }}-build-logs
          path: |
            ${{ runner.temp }}/build-${{ matrix.arch }}.log
            ${{ runner.temp }}/build-${{ matrix.arch }}.log.stderr
            ${{ runner.temp }}/prepare-${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: windows-*-packages
          path: dist
          merge-multiple: true
      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_TITLE: ${{ needs.version.outputs.title }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
          BASE_VERSION: ${{ needs.version.outputs.base }}
        run: |
          set -euo pipefail
          cd dist
          for arch in x64 x86; do
            asset="Ayugram-Desktop-Base-${RELEASE_TAG#base-}-Windows-$arch.zip"
            setup="Ayugram-Desktop-Base-${RELEASE_TAG#base-}-Windows-$arch-setup.exe"
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum --check "$asset.sha256"
            unzip -t "$asset"
            test -s "$setup"
            test -s "$setup.sha256"
            sha256sum --check "$setup.sha256"
            7z t "$setup"
          done
          cat ./*.sha256 > SHA256SUMS.txt
          cat > release-notes.md <<EOF
          Windows x64 / x86 自构建安装包和便携版，基于 AyuGram Desktop $BASE_VERSION。

          - 安装包采用 Telegram 官方使用的 Inno Setup 形式。
          - 可运行对应架构的 setup.exe 安装，或解压 ZIP 使用便携版。
          - 下载加速位于 AyuGram → General → Downloads → Download Acceleration，提供 Off / Fast / Ultra 三档。
          - TelegramForcePortable 目录将账号数据保存在程序旁边；移动或删除压缩包解压目录前请备份该目录。
          - 此自构建版本未进行代码签名，关闭自动更新；后续版本请从本仓库 Releases 获取。
          - SHA-256 校验值见 SHA256SUMS.txt。

          Source: https://github.com/$GH_REPO/commit/$RELEASE_COMMIT
          Build: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          EOF
          if ! gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*-setup.exe SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" \
            --notes-file release-notes.md --draft=false --latest
